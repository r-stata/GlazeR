<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="GlazeR 工作流：选中文件、按住快捷键呼出转盘、拖入扇区后由 R / Python / Stata 引擎本地执行并写出结果" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <defs>
    <clipPath id="frame"><rect width="1200" height="420" rx="18"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E5EAF1" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#F4F6F9"/>
    <rect y="58" width="1200" height="362" fill="url(#grid)" opacity="0.75"/>

    <!-- 深色顶栏 -->
    <rect width="1200" height="58" rx="18" fill="#1F2937"/>
    <rect y="36" width="1200" height="22" fill="#1F2937"/>
    <circle cx="28" cy="29" r="6" fill="#FF5F57"/>
    <circle cx="48" cy="29" r="6" fill="#FEBC2E"/>
    <circle cx="68" cy="29" r="6" fill="#28C840"/>
    <text x="92" y="35" font-size="17" font-weight="700" fill="#F8FAFC">GlazeR</text>
    <text x="1150" y="34" text-anchor="end" font-size="13" fill="#CBD5E1">Option + 0–9 · 本地执行，数据不上传</text>

    <!-- 左：输入文件 -->
    <rect x="62" y="142" width="230" height="160" rx="14" fill="#E8ECF2" opacity="0.7"/>
    <rect x="60" y="140" width="230" height="160" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="86" y="166" width="40" height="50" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
    <path d="M 116 166 L 126 176 L 126 216 L 86 216 L 86 166 Z" fill="none" stroke="#C7D2FE"/>
    <text x="106" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#4F46E5">DTA</text>
    <text x="140" y="190" font-size="15" font-weight="700" fill="#1F2937">data.dta</text>
    <text x="140" y="212" font-size="12" fill="#64748B">Finder 选中 / 拖入</text>
    <rect x="86" y="244" width="178" height="34" rx="9" fill="#F1F5F9"/>
    <text x="100" y="266" font-size="12.5" fill="#334155">按住 Option → 转盘弹出</text>

    <path d="M 296 220 L 328 220" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- 中：8 扇区转盘 -->
    <circle cx="470" cy="220" r="138" fill="#FFFFFF" opacity="0.85"/>
    <g stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">
      <path d="M 470 220 L 470 88 A 132 132 0 0 1 563.3 126.7 Z" fill="#4F46E5"/>
      <path d="M 470 220 L 563.3 126.7 A 132 132 0 0 1 602 220 Z" fill="#2563EB"/>
      <path d="M 470 220 L 602 220 A 132 132 0 0 1 563.3 313.3 Z" fill="#0891B2"/>
      <path d="M 470 220 L 563.3 313.3 A 132 132 0 0 1 470 352 Z" fill="#16A34A"/>
      <path d="M 470 220 L 470 352 A 132 132 0 0 1 376.7 313.3 Z" fill="#65A30D"/>
      <path d="M 470 220 L 376.7 313.3 A 132 132 0 0 1 338 220 Z" fill="#F59E0B"/>
      <path d="M 470 220 L 338 220 A 132 132 0 0 1 376.7 126.7 Z" fill="#EA580C"/>
      <path d="M 470 220 L 376.7 126.7 A 132 132 0 0 1 470 88 Z" fill="#DB2777"/>
    </g>
    <g text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">
      <text x="505" y="140">R</text>
      <text x="555" y="190">Py</text>
      <text x="555" y="260">CSV</text>
      <text x="505" y="310">XLSX</text>
      <text x="435" y="310">DTA</text>
      <text x="385" y="260">Stata</text>
      <text x="385" y="190">JSON</text>
      <text x="435" y="140">RDS</text>
    </g>
    <circle cx="470" cy="220" r="44" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="470" y="215" text-anchor="middle" font-size="11" fill="#94A3B8">Opt 1</text>
    <text x="470" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">GlazeR</text>

    <path d="M 612 220 L 678 220" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- 右：引擎卡 -->
    <g>
      <rect x="690" y="110" width="250" height="68" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="690" y="110" width="5" height="68" rx="2" fill="#276DC3"/>
      <text x="712" y="139" font-size="14" font-weight="700" fill="#1F2937">R · runner.R</text>
      <text x="712" y="160" font-size="12" fill="#64748B">readr::read_csv / haven::read_dta</text>

      <rect x="690" y="192" width="250" height="68" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="690" y="192" width="5" height="68" rx="2" fill="#3776AB"/>
      <text x="712" y="221" font-size="14" font-weight="700" fill="#1F2937">Python · runner.py</text>
      <text x="712" y="242" font-size="12" fill="#64748B">convert(FILE, "xlsx") / pandas</text>

      <rect x="690" y="274" width="250" height="68" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="690" y="274" width="5" height="68" rx="2" fill="#1A3B5D"/>
      <text x="712" y="303" font-size="14" font-weight="700" fill="#1F2937">Stata · runner.do</text>
      <text x="712" y="324" font-size="12" fill="#64748B">stata-mp -b do / `file' / `out'</text>
    </g>

    <path d="M 946 220 L 972 220" fill="none" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- 右：输出 -->
    <rect x="980" y="110" width="185" height="232" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="1000" y="140" font-size="13" font-weight="700" fill="#334155">输出（源文件旁）</text>
    <g font-size="12.5" fill="#475569">
      <circle cx="1005" cy="170" r="3.5" fill="#4F46E5"/><text x="1017" y="175">data_glazed.rds</text>
      <circle cx="1005" cy="196" r="3.5" fill="#2563EB"/><text x="1017" y="201">data_glazed.csv</text>
      <circle cx="1005" cy="222" r="3.5" fill="#16A34A"/><text x="1017" y="227">data_glazed.xlsx</text>
      <circle cx="1005" cy="248" r="3.5" fill="#F59E0B"/><text x="1017" y="253">data_glazed.dta</text>
      <circle cx="1005" cy="274" r="3.5" fill="#DB2777"/><text x="1017" y="279">完整 job.log</text>
    </g>
    <text x="1000" y="312" font-size="11" fill="#94A3B8">通知卡片 / 运行日志可回看</text>
    <text x="1000" y="329" font-size="11" fill="#94A3B8">重名文件自动加 (1)、(2)</text>

    <!-- 底部说明 -->
    <text x="60" y="392" font-size="12.5" fill="#64748B">路径 / 文件名 / 目录 / 输出路径自动注入 → 引擎本地执行 → 结果写入源文件旁 → 通知卡片与日志可回看全过程</text>
    <text x="1150" y="392" text-anchor="end" font-size="11.5" fill="#94A3B8">GlazeR · v1.0.0</text>
  </g>
</svg>
